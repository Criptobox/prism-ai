<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141426"/>
      <stop offset="0.55" stop-color="#0B0B16"/>
      <stop offset="1" stop-color="#07070C"/>
    </linearGradient>
    <linearGradient id="brand" x1="0.1" y1="0.95" x2="0.9" y2="0.05">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.62">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="url(#brand)" stroke-opacity="0.28" stroke-width="3"/>

  <!-- ambient glow -->
  <circle cx="256" cy="250" r="168" fill="url(#glow)"/>

  <!-- dispersed rays (behind prism) -->
  <g stroke-linecap="round" filter="url(#soft)" opacity="0.55">
    <line x1="300" y1="248" x2="418" y2="168" stroke="#8B5CF6" stroke-width="20"/>
    <line x1="304" y1="252" x2="434" y2="246" stroke="#22D3EE" stroke-width="20"/>
    <line x1="300" y1="256" x2="414" y2="330" stroke="#F472B6" stroke-width="20"/>
  </g>
  <g stroke-linecap="round">
    <line x1="298" y1="246" x2="410" y2="172" stroke="#A78BFA" stroke-width="11"/>
    <line x1="302" y1="250" x2="428" y2="246" stroke="#67E8F9" stroke-width="11"/>
    <line x1="298" y1="254" x2="406" y2="322" stroke="#F9A8D4" stroke-width="11"/>
  </g>

  <!-- prism -->
  <path d="M 256 118 L 384 356 L 128 356 Z"
        fill="#FFFFFF" fill-opacity="0.045"
        stroke="url(#brand)" stroke-width="17" stroke-linejoin="round"/>

  <!-- incoming beam -->
  <line x1="72" y1="292" x2="206" y2="272" stroke="url(#beam)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="206" cy="272" r="9" fill="#FFFFFF"/>
</svg>
