# Prism AI — CI: compilar, tests unitarios y E2E en cada push.
#
# Los E2E vigilan cosas que ningún test unitario puede comprobar: que la puerta
# de la revisión bloquea de verdad la subida de una credencial, que el Sandbox
# ejecuta módulos ES en un navegador real y que la interfaz cabe a 320 px. Por
# eso corren en cada push y no solo a mano.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Compilar y tests unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      # Archivos y dependencias que no usa nadie. Se limpiaron 30 componentes
      # huérfanos y 39 dependencias a mano; esto es para no repetir la búsqueda.
      - name: Restos sin usar (knip)
        run: npm run knip

      - name: Compilar
        run: npm run build

      - name: Tests unitarios
        run: npm run test

  e2e:
    name: E2E en Chromium
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-fund --no-audit

      # El navegador es lo más lento de instalar: se cachea por versión de
      # Playwright, que es la que decide qué build hace falta.
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Caché del navegador
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Instalar Chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Dependencias del sistema para Chromium
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Guardar las trazas de los fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trazas
          path: test-results/
          retention-days: 7
