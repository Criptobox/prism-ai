# Prism AI — CI: lint + build en cada push y pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-fund --no-audit

      - name: Generar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: file:./db/ci.db

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./db/ci.db
